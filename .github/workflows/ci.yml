name: CI

on:
  push:
    branches:
      - main
      - staging
      - 'staging/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code quality & repo hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Verify code formatting
        run: npm run format:check

      - name: Validate JavaScript syntax
        run: node scripts/check-syntax.js

      - name: Verify package integrity
        run: npm pack --dry-run

      - name: Verify ignore rules for sensitive paths
        run: |
          for path in .pongkan-crew/state.json .env .env.local .aws/credentials .ssh/id_rsa .codex/auth.json credentials.json server.key; do
            git check-ignore -q -- "$path" || { echo "Sensitive path is not ignored: $path"; exit 1; }
          done
          echo "Sensitive file patterns are correctly ignored."

  test:
    name: Test (Node ${{ matrix.node-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node-version:
          - 22
          - 24
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run test suite
        run: npm test

      - name: Verify offline preview display
        run: node scripts/preview-display.js

      - name: Verify offline preview activity view
        run: node scripts/preview-display.js --activity
